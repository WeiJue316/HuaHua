[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-agent"
version = "0.1.0"
description = "面向计算机/AI 文献调研的可追溯科研 Agent 框架"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "mcp>=1.0",
  "pydantic>=2.10",
  "pypdf>=6.19.0",
  "typer>=0.15",
  "uvicorn[standard]>=0.34",
]

[project.scripts]
research-agent = "research_agent.cli:main"
arxiv-mcp = "research_agent.mcp_servers.arxiv.server:main"
openalex-mcp = "research_agent.mcp_servers.openalex.server:main"
crossref-mcp = "research_agent.mcp_servers.crossref.server:main"
semantic-scholar-mcp = "research_agent.mcp_servers.semantic_scholar.server:main"
dblp-mcp = "research_agent.mcp_servers.dblp.server:main"

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "reportlab>=5.0.1",
  "ruff>=0.9",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["research_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
